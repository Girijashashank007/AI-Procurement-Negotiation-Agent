<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall · Procurement Negotiation Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Sora:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a1c;--ink:#eef0ff;--mute:#9aa0c7;--glass:rgba(255,255,255,.055);--edge:rgba(255,255,255,.11);--v:#7c5cff;--c:#22d3ee;--p:#ff5cae;--g:#34d399;--a:#fbbf24}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:grid;grid-template-columns:340px 1fr;overflow:hidden;position:relative}
/* animated aurora background */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:float 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:560px;height:560px;background:var(--v);top:-160px;left:-120px}
.aurora i:nth-child(2){width:480px;height:480px;background:var(--c);bottom:-180px;right:-100px;animation-delay:-6s;opacity:.32}
.aurora i:nth-child(3){width:380px;height:380px;background:var(--p);top:35%;left:48%;animation-delay:-11s;opacity:.22}
@keyframes float{to{transform:translate(90px,60px) scale(1.15)}}
aside{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--edge);background:rgba(8,10,28,.55);backdrop-filter:blur(22px)}
.brand{padding:26px 24px 8px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 200deg,var(--v),var(--c),var(--p),var(--v));display:grid;place-items:center;box-shadow:0 0 28px rgba(124,92,255,.6)}
.logo::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--bg)}
.brand h1{font:800 24px Sora;letter-spacing:-.02em}
.live{margin:6px 24px 18px;font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.search{margin:0 16px 12px;padding:12px 16px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);font:inherit;font-size:14px}
.search::placeholder{color:var(--mute)} 
.add-vendor{
  margin:0 16px 12px;
  width:calc(100% - 32px);
  padding:11px 14px;
  border:1px solid rgba(124,92,255,.5);
  border-radius:14px;
  background:rgba(124,92,255,.12);
  color:var(--ink);
  font:600 13px Manrope;
  cursor:pointer;
  transition:.2s;
}

.add-vendor:hover{
  background:rgba(124,92,255,.25);
  border-color:var(--v);
  transform:translateY(-1px);
}
#list{overflow:auto;padding:0 12px 16px;flex:1}
#list::-webkit-scrollbar,main::-webkit-scrollbar{width:6px}#list::-webkit-scrollbar-thumb,main::-webkit-scrollbar-thumb{background:var(--edge);border-radius:9px}
.v{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;color:inherit;font:inherit;padding:10px 12px;border-radius:14px;cursor:pointer;margin-bottom:4px;transition:all .18s}
.v:hover{background:var(--glass);border-color:var(--edge)}
.v.on{background:linear-gradient(120deg,rgba(124,92,255,.35),rgba(34,211,238,.16));border-color:rgba(124,92,255,.6);box-shadow:0 8px 26px rgba(124,92,255,.22)}
.av{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 14px Sora;color:#fff}
.v b{display:block;font-size:14px;font-weight:600}.v span{font-size:12px;color:var(--mute)}
button:focus-visible,input:focus-visible{outline:2px solid var(--c);outline-offset:2px}
main{overflow:auto;padding:38px 46px}
/* hero */
.hero{max-width:720px;margin:9vh auto 0;text-align:center}
.hero h2{font:800 clamp(34px,5vw,56px)/1.08 Sora;letter-spacing:-.035em;background:linear-gradient(100deg,#fff 20%,var(--c) 55%,var(--p));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:200%}}
.hero p{color:var(--mute);margin:18px auto 0;line-height:1.7;max-width:520px}
.stats{display:flex;justify-content:center;gap:14px;margin:34px 0 26px;flex-wrap:wrap}
.stat{background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:16px 26px;backdrop-filter:blur(14px)}
.stat b{font:800 30px Sora;display:block}.stat span{font-size:12px;color:var(--mute)}
.quick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.quick button{border:1px solid var(--edge);background:var(--glass);color:var(--ink);font:inherit;font-size:13px;padding:9px 16px;border-radius:99px;cursor:pointer;transition:.18s}
.quick button:hover{border-color:var(--c);box-shadow:0 0 20px rgba(34,211,238,.3)}
/* vendor header */
.head{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.head .av{width:68px;height:68px;border-radius:20px;font-size:24px;box-shadow:0 10px 34px rgba(124,92,255,.4)}
.head h2{font:800 34px Sora;letter-spacing:-.03em}
.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid var(--edge);background:var(--glass);color:var(--mute)}
.sp{flex:1}
.go{position:relative;border:0;font:700 15px Manrope;color:#fff;padding:15px 28px;border-radius:14px;cursor:pointer;background:linear-gradient(110deg,var(--v),#4f7cff 50%,var(--c));background-size:200%;box-shadow:0 10px 34px rgba(124,92,255,.5);transition:.25s}
.go:hover{background-position:100%;transform:translateY(-2px)}.go:disabled{opacity:.6;cursor:wait;transform:none}
.ghost{border:1px solid var(--edge);background:var(--glass);color:var(--ink);font:600 13px Manrope;padding:8px 14px;border-radius:10px;cursor:pointer}
/* pipeline loader */
.pipe{display:flex;align-items:center;justify-content:center;gap:0;margin:9vh auto 0;max-width:640px}
.node{text-align:center;width:150px;color:var(--mute);font-size:13px;transition:.3s}
.orb{width:58px;height:58px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;border:1px solid var(--edge);background:var(--glass);font-size:22px;transition:.3s}
.node.act{color:var(--ink)}.node.act .orb{border-color:var(--c);box-shadow:0 0 34px rgba(34,211,238,.6);animation:beat 1s infinite}
.node.done{color:var(--g)}.node.done .orb{border-color:var(--g);background:rgba(52,211,153,.15)}
@keyframes beat{50%{transform:scale(1.12)}}
.link{flex:1;height:2px;background:var(--edge);margin-bottom:28px;position:relative;overflow:hidden}
.link.on::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--c),transparent);animation:run 1s linear infinite}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
/* results */
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:20px;padding:22px;backdrop-filter:blur(18px)}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.badge{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:600;color:var(--g);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);padding:6px 12px;border-radius:99px}
.sec{--k:var(--c);border:1px solid var(--edge);border-top:2px solid var(--k);border-radius:16px;padding:16px 18px;margin-bottom:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--k) 9%,transparent),transparent 60%);animation:rise .6s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sec h4{display:flex;align-items:center;gap:10px;font:700 14px Sora;margin-bottom:10px}
.sec h4 em{font-style:normal;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 25%,transparent);color:var(--k)}
.sec li{margin:0 0 7px 20px;font-size:14px;line-height:1.65;color:#dfe2fb}.sec li::marker{color:var(--k)}
.sec p{font-size:14px;line-height:1.65;margin-bottom:6px;color:#dfe2fb}
.mem{border-left:2px solid var(--v);background:rgba(124,92,255,.1);border-radius:0 12px 12px 0;padding:12px 14px;font-size:12.5px;line-height:1.6;margin-bottom:10px;color:#d3d7f5;white-space:pre-wrap;animation:rise .5s both}
.glass h3{font:700 15px Sora;margin-bottom:14px}
.err{background:rgba(255,92,120,.12);border:1px solid rgba(255,92,120,.4);color:#ffb3c1;padding:18px;border-radius:14px;font-size:14px;line-height:1.6}
@media(max-width:900px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;overflow:auto}aside{max-height:300px}main{padding:22px}.grid{grid-template-columns:1fr}.node{width:90px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<aside>
  <div class="brand"><div class="logo"></div><h1>Recall</h1></div>
  <div class="live"><i></i>Hindsight memory online</div>
  <input class="search" id="q" placeholder="Search vendors" aria-label="Search vendors">
  <button class="add-vendor" id="addVendorBtn">＋ Add New Vendor</button>
  <div id="list"></div>
</aside>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s);
let vendors=[],current=null,lastText='';
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const fmt=d=>new Date(d).toLocaleDateString('en-IN',{month:'short',year:'numeric'});
const grads=[['#7c5cff','#22d3ee'],['#ff5cae','#7c5cff'],['#22d3ee','#34d399'],['#fbbf24','#ff5cae'],['#4f7cff','#a855f7']];
const av=n=>{const g=grads[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%grads.length];
  return `<div class="av" style="background:linear-gradient(135deg,${g[0]},${g[1]})">${n.split(' ').slice(0,2).map(w=>w[0]).join('')}</div>`};

async function init(){
  try{
    const r=await fetch('/api/vendors');
    if(!r.ok)throw new Error('Server answered with status '+r.status);
    vendors=await r.json();
  }catch(e){
    $('#main').innerHTML=`<div class="err" style="max-width:640px;margin:10vh auto"><b>Can't reach the backend.</b><br>1. Run <code>python server.py</code> in your project folder.<br>2. Open <b>http://127.0.0.1:5000</b> in your browser. Don't double-click index.html.<br><br>Details: ${esc(e.message)}</div>`;
    return;
  }
  draw();$('#q').oninput=draw;home();
}
function home(){
  current=null;draw();
  const picks=['Nexus Components','Solvex Chemicals','Summit Industrial Supplies','Falcon Freight Solutions'];
  $('#main').innerHTML=`<div class="hero"><h2>Never walk into a negotiation blind again.</h2>
  <p>Recall remembers every price, delay and tactic from past vendor talks, then turns it into a briefing you can use in the room.</p>
  <div class="stats"><div class="stat"><b>${vendors.length}</b><span>vendors remembered</span></div><div class="stat"><b>${vendors.length}</b><span>memories in Hindsight</span></div><div class="stat"><b>2</b><span>steps to a briefing</span></div></div>
  <div class="quick">${picks.map(p=>`<button data-v="${p}">${p}</button>`).join('')}</div></div>`;
  document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>pick(vendors.find(v=>v.name===b.dataset.v)));
}
function draw(){
  const q=$('#q').value.toLowerCase();$('#list').innerHTML='';
  vendors.filter(v=>v.name.toLowerCase().includes(q)).forEach(v=>{
    const b=document.createElement('button');
    b.className='v'+(current&&current.name===v.name?' on':'');
    b.innerHTML=`${av(v.name)}<div><b>${esc(v.name)}</b><span>${esc(v.context)}</span></div>`;
    b.onclick=()=>pick(v);$('#list').appendChild(b);
  });
}
function pick(v){
  current=v;draw();
  $('#main').innerHTML=`<div class="head">${av(v.name)}<div><h2>${esc(v.name)}</h2><div class="chips"><span class="chip">${esc(v.context)}</span><span class="chip">Last record ${fmt(v.timestamp)}</span></div></div><div class="sp"></div><button class="go" id="go">Generate briefing</button></div><div id="out"></div>`;
  $('#go').onclick=()=>brief(v);
}
const ICON=[['PAST','◷','--c'],['WORKED','✓','--g'],['LESSON','⇄','--a'],['NEXT','➜','--v']];
function render(md){
  let html='',open=false,list=false,n=0;
  const cl=()=>{if(list){html+='</ul>';list=false}};
  md.split('\n').forEach(l=>{
    l=l.trim();if(!l||/^\|?[-:| ]+\|?$/.test(l))return;
    const h=l.match(/^#{1,4}\s*(?:\d+\.\s*)?(.+)/);
    if(h){cl();if(open)html+='</div>';
      const ic=ICON.find(i=>h[1].toUpperCase().includes(i[0]))||['','•','--c'];
      html+=`<div class="sec" style="--k:var(${ic[2]});animation-delay:${n++*160}ms"><h4><em>${ic[1]}</em>${inline(h[1])}</h4>`;open=true;return}
    if(/^[-*•]\s+/.test(l)){if(!list){html+='<ul>';list=true}html+=`<li>${inline(l.replace(/^[-*•]\s+/,''))}</li>`;return}
    cl();html+=`<p>${inline(l)}</p>`;
  });
  cl();if(open)html+='</div>';return html;
}
function pipe(n){
  const s=[['🧠','Recall from Hindsight'],['⚡','Reason with Groq'],['📝','Write briefing']];
  return '<div class="pipe">'+s.map((x,i)=>`<div class="node ${i<n?'done':i===n?'act':''}"><div class="orb">${i<n?'✓':x[0]}</div>${x[1]}</div>`+(i<2?`<div class="link ${i===n?'on':''}" style="${i<n?'background:var(--g)':''}"></div>`:'')).join('')+'</div>';
}
async function brief(v){
  const go=$('#go');go.disabled=true;go.textContent='Working…';
  $('#out').innerHTML=pipe(0);
  const t1=setTimeout(()=>$('#out').innerHTML=pipe(1),1600),t2=setTimeout(()=>$('#out').innerHTML=pipe(2),4200);
  try{
    const r=await fetch('/api/brief',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vendor:v.name})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');
    lastText=d.briefing;
    $('#out').innerHTML=`<div class="grid"><div class="glass"><div class="bar"><span class="badge">● Grounded only in stored vendor history</span><button class="ghost" id="cp">Copy briefing</button></div>${render(d.briefing)}</div>
      <div class="glass"><h3>Memories recalled (${d.memories.length})</h3>${d.memories.length?d.memories.map((m,i)=>`<div class="mem" style="animation-delay:${i*110}ms">${esc(m)}</div>`).join(''):'<p style="color:var(--mute);font-size:14px">No memories found for this vendor.</p>'}</div></div>`;
    $('#cp').onclick=e=>{navigator.clipboard.writeText(lastText);e.target.textContent='Copied'};
  }catch(e){
    $('#out').innerHTML=`<div class="err"><b>Could not generate the briefing.</b><br>${esc(e.message)}<br>Check that server.py is running and both API keys are set in .env.</div>`;
  }
  clearTimeout(t1);clearTimeout(t2);go.disabled=false;go.textContent='Regenerate briefing';
}

$('#addVendorBtn').onclick=()=>{
  $('#main').innerHTML=`
    <div class="glass" style="max-width:700px;margin:5vh auto">
      <h2 style="font:800 28px Sora;margin-bottom:24px">Add New Vendor</h2>

      <label>Vendor Name</label>
      <input id="newVendorName" class="search" style="width:100%;margin:8px 0 18px"
             placeholder="e.g. BlueRock Supplies">

      <label>Vendor Context</label>
      <input id="newVendorContext" class="search" style="width:100%;margin:8px 0 18px"
             placeholder="e.g. Electronics supplier">

      <label>Negotiation History</label>
      <textarea id="newVendorHistory"
        style="width:100%;min-height:180px;margin:8px 0 18px;padding:14px;
        border-radius:14px;border:1px solid var(--edge);background:var(--glass);
        color:var(--ink);font:14px Manrope;resize:vertical"
        placeholder="Enter past prices, discounts, delays, quality issues, negotiation outcomes..."></textarea>

      <button class="go" id="saveVendor">Add Vendor</button>
    </div>
  `;

  $('#saveVendor').onclick=async ()=>{
    const name=$('#newVendorName').value.trim();
    const context=$('#newVendorContext').value.trim();
    const history=$('#newVendorHistory').value.trim();

    if(!name||!context||!history){
      alert('Please fill all fields.');
      return;
    }

    const response = await fetch('/api/vendors', {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json'
  },
  body: JSON.stringify({
    name: name,
    context: context,
    history: history
  })
});

const result = await response.json();

if (!response.ok) {
  alert(result.error || 'Failed to add vendor.');
  return;
}

vendors.push(result.vendor);
draw();
pick(result.vendor);
  };
};
init();
</script>
</body>
</html>
